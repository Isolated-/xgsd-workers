name: CI & Release (Beta)

on:
  push:
    tags:
      - 'v*.*.*-beta*' # Trigger on all beta tags

jobs:
  # Run tests (single Node version is enough for beta)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn

      - name: Cache fixture node_modules
        uses: actions/cache@v4
        with:
          path: |
            fixtures/benchmark/node_modules
            fixtures/errors/node_modules
            fixtures/typescript/node_modules
          key: ${{ runner.os }}-fixtures-node-modules-${{ hashFiles('fixtures/**/package.json', 'fixtures/**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-fixtures-node-modules-

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: combined fixtures
        working-directory: ./fixtures/combined
        run: yarn install --production

      - run: yarn install --frozen-lockfile
      - run: yarn test

  # Build once
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: ./dist

  release-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Get version from tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        id: version
      - run: yarn version --new-version ${{ steps.version.outputs.version }} --no-git-tag-version
      - run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public --tag beta
