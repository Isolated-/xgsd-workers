name: quick tests against ubuntu

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [24.x, 25.x]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: yarn

      # ----------------------------
      # Cache fixture node_modules
      # ----------------------------
      - name: Cache fixture node_modules
        uses: actions/cache@v4
        with:
          path: |
            fixtures/combined/node_modules
          key: ${{ runner.os }}-fixtures-node-modules-${{ hashFiles('fixtures/**/package.json', 'fixtures/**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-fixtures-node-modules-

      - run: yarn install --frozen-lockfile
      - run: yarn build

      # ----------------------------
      # Setup fixtures
      # ----------------------------
      - name: combined fixtures
        working-directory: ./fixtures/combined
        run: yarn install --production

      # ----------------------------
      # Main project install + build
      # ----------------------------
      - run: yarn test
